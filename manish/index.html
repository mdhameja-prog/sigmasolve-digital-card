<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manish Dhameja | Sigma Solve</title>
<style>
:root{--accent:#7567df;--text:#333;--muted:#8b8b8b;--bg:#f5f5f5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.card{max-width:680px;margin:28px auto;background:#fff;border-radius:16px;padding:28px 30px 34px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.profile{text-align:left}.profile img{width:110px;height:110px;border-radius:55px;object-fit:cover;display:block;margin-bottom:18px}
h1{font-size:30px;margin:0 0 8px}.role{font-size:19px;color:#888;margin-bottom:8px}.company{font-size:18px;color:#888}
.actions{display:flex;gap:10px;margin:28px 0 24px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:14px 18px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-decoration:none;text-align:center;flex:1;min-width:150px}
.item{padding:16px 0;border-top:1px solid #eee}.label{font-size:14px;color:#999;margin-bottom:7px}.value,a.value{font-size:18px;color:var(--accent);text-decoration:none;word-break:break-word}
@media(max-width:520px){.card{margin:0;border-radius:0;min-height:100vh;padding:24px 20px}h1{font-size:27px}.btn{min-width:100%}}
</style>
</head>
<body>
<main class="card">
  <section class="profile">
    <img src="assets/manish.jpg" alt="Manish Dhameja">
    <h1>Manish Dhameja</h1>
    <div class="role">UI/UX Designer</div>
    <div class="company">Sigma Solve</div>
  </section>

  <div class="actions">
    <a class="btn" href="tel:+919558300587">Call</a>
    <a class="btn" href="mailto:mdhameja@gmail.com">Email</a>
    <a class="btn" href="manish.vcf" download>Download vCard</a>
  </div>

  <div class="item"><div class="label">Phone</div><a class="value" href="tel:+919558300587">+91 9558300587</a></div>
  <div class="item"><div class="label">Email</div><a class="value" href="mailto:mdhameja@gmail.com">mdhameja@gmail.com</a></div>
  <div class="item"><div class="label">Address</div><div class="value" style="color:#333">Bhavnagar, 364002</div></div>
  <div class="item"><div class="label">Website</div><a class="value" href="https://www.sigmasolve.com" target="_blank" rel="noopener">www.sigmasolve.com</a></div>
</main>
</body>
</html>
