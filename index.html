<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigma Solve — QR Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:820px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:28px;box-shadow:0 8px 30px #17203312}
h1{margin:0 0 8px;font-size:28px}.sub{color:#667085;margin-bottom:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d6dbe5;border-radius:10px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#667eea}.custom{border-top:1px solid #eaecf0;margin-top:12px;padding-top:18px}
.row{display:grid;grid-template-columns:1fr 1.4fr 150px 44px;gap:8px;margin-bottom:9px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.add{background:#eef2ff;color:#3949ab}.generate{background:#111827;color:#fff;width:100%;font-size:16px;margin-top:18px}
.remove{background:#fff0f0;color:#c62828}.status{margin-top:15px;padding:12px;border-radius:10px;display:none}
.result{display:none;margin-top:22px;text-align:center;border-top:1px solid #eaecf0;padding-top:22px}
.result img{width:240px;height:240px;border:10px solid white;box-shadow:0 4px 18px #0002}
.url{word-break:break-all;background:#f7f8fa;padding:10px;border-radius:8px;margin:12px 0}
.small{font-size:12px;color:#667085}
@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row select{grid-column:1}.row .remove{grid-column:2}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Sigma Solve Digital Card</h1>
<div class="sub">Create a QR code that opens a normal mobile digital business card.</div>

<div class="grid">
  <div class="field"><label>Full Name</label><input id="name" placeholder="Manish Dhameja"></div>
  <div class="field"><label>Designation</label><input id="designation" placeholder="UI/UX Designer"></div>
  <div class="field"><label>Company</label><input id="company" placeholder="Sigma Solve"></div>
</div>

<div class="custom">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div><b>Contact fields</b><div class="small">Add or remove any field you want.</div></div>
    <button class="btn add" onclick="addField()">+ Add Field</button>
  </div>
  <div id="fields"></div>
</div>

<button class="btn generate" onclick="generateCard()">Generate QR Code</button>
<div id="status" class="status"></div>

<div id="result" class="result">
  <h2 style="margin:0 0 8px">QR Code Ready</h2>
  <img id="qr" alt="QR Code">
  <div id="publicUrl" class="url"></div>
  <button class="btn add" onclick="downloadQR()">Download QR PNG</button>
  <a id="openCard" class="btn add" style="display:inline-block;text-decoration:none;margin-left:6px" target="_blank">Open Card</a>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const SUPABASE_URL = "https://pzricttvourvfvymwcjs.supabase.co";
const SUPABASE_KEY = "sb_publishable_PUqEGsrCKbj3h3UyrUuDaw_MvrCNrXv";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const defaults = [
  ["Phone","", "phone"],
  ["Email","", "email"],
  ["Address","", "text"],
  ["Website","", "url"]
];

function addField(label="",value="",type="text"){
  const row=document.createElement("div"); row.className="row";
  row.innerHTML=`<input class="f-label" placeholder="Field name" value="${escapeHtml(label)}">
    <input class="f-value" placeholder="Value" value="${escapeHtml(value)}">
    <select class="f-type"><option value="text">Text</option><option value="phone">Phone</option><option value="email">Email</option><option value="url">Website</option><option value="whatsapp">WhatsApp</option></select>
    <button class="btn remove" title="Delete">×</button>`;
  row.querySelector(".f-type").value=type;
  row.querySelector(".remove").onclick=()=>row.remove();
  document.getElementById("fields").appendChild(row);
}
function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
defaults.forEach(x=>addField(...x));

function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "card";}

async function generateCard(){
  const name=document.getElementById("name").value.trim();
  if(!name){showStatus("Please enter Full Name.",true);return;}
  const rows=[...document.querySelectorAll(".row")];
  const fields=rows.map(r=>({label:r.querySelector(".f-label").value.trim(),value:r.querySelector(".f-value").value.trim(),type:r.querySelector(".f-type").value}))
    .filter(x=>x.label && x.value);
  const data={name,designation:document.getElementById("designation").value.trim(),company:document.getElementById("company").value.trim(),fields};

  let base=slugify(name), slug=base, n=2;
  while(true){
    const {data:found,error}=await db.from("digital_cards").select("slug").eq("slug",slug).maybeSingle();
    if(error){showStatus(error.message,true);return;}
    if(!found) break;
    slug=base+"-"+n++;
  }

  const {error}=await db.from("digital_cards").insert({slug,data});
  if(error){showStatus(error.message,true);return;}

  const cardUrl=new URL("card.html",location.href); cardUrl.searchParams.set("slug",slug);
  const qrCanvas=document.createElement("canvas");
  await QRCode.toCanvas(qrCanvas,cardUrl.toString(),{width:1000,margin:4,errorCorrectionLevel:"H"});
  const qr=document.getElementById("qr"); qr.src=qrCanvas.toDataURL("image/png");
  document.getElementById("publicUrl").textContent=cardUrl.toString();
  document.getElementById("openCard").href=cardUrl.toString();
  document.getElementById("result").style.display="block";
  window.lastQR=qrCanvas.toDataURL("image/png");
  showStatus("Card saved successfully.",false);
}
function downloadQR(){const a=document.createElement("a");a.href=window.lastQR;a.download="sigma-solve-qr.png";a.click();}
function showStatus(msg,error){const s=document.getElementById("status");s.textContent=msg;s.style.display="block";s.style.background=error?"#fff1f2":"#ecfdf3";s.style.color=error?"#b42318":"#027a48";}
</script>
</body>
</html>
